name: Publish Docker images

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: publish-images-${{ github.ref }}
    cancel-in-progress: false

env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
    WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}

jobs:
    publish:
        name: Build and publish
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.4
              with:
                  aws-region: ${{ env.AWS_REGION }}
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}

            - name: Authenticate with Amazon ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Configure Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0

            - name: Build and publish API image
              uses: docker/build-push-action@v7.3.0
              with:
                  context: .
                  file: apps/api/Dockerfile
                  platforms: linux/amd64
                  push: true
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha,scope=codekeat-api
                  cache-to: type=gha,mode=max,scope=codekeat-api
                  tags: |
                      ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:sha-${{ github.sha }}
                      ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:latest

            - name: Build and publish web image
              uses: docker/build-push-action@v7.3.0
              with:
                  context: .
                  file: apps/web/Dockerfile
                  platforms: linux/amd64
                  push: true
                  provenance: mode=max
                  sbom: true
                  build-args: |
                      NEXT_PUBLIC_APP_NAME=Codekeat
                      NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
                  cache-from: type=gha,scope=codekeat-web
                  cache-to: type=gha,mode=max,scope=codekeat-web
                  tags: |
                      ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:sha-${{ github.sha }}
                      ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:latest
